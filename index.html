<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Ineptiae Latinae</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#ui{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
#fx{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:999px;padding:10px 14px;background:#fff3;color:#fff;font-size:15px;backdrop-filter:blur(6px)}
button.on{background:#fff;color:#000}
#snap{width:76px;height:76px;font-size:28px;background:#fff;color:#000}
#start{position:fixed;inset:0;margin:auto;width:220px;height:64px;font-size:20px;background:#fff;color:#000}
#reticle{position:fixed;left:50%;top:50%;width:28px;height:28px;margin:-14px;border:2px solid #fff;border-radius:50%;opacity:.8}
#status{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:13px;opacity:.8}
</style></head><body>
<canvas id="c"></canvas><div id="reticle"></div><div id="status">Tap start</div>
<div id="ui" hidden><div id="fx"></div><button id="snap">✨</button></div>
<button id="start">Start camera</button>
<script type="module">
import {FilesetResolver,InteractiveSegmenter} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const $=id=>document.getElementById(id), c=$('c'), ctx=c.getContext('2d');
const video=document.createElement('video'); video.playsInline=true; video.muted=true;
const SW=192, seg=document.createElement('canvas'), sctx=seg.getContext('2d',{willReadFrequently:true});
const mk=document.createElement('canvas'), mctx=mk.getContext('2d');
const fx=document.createElement('canvas'), fctx=fx.getContext('2d');
const px=document.createElement('canvas'), pctx=px.getContext('2d');
const EFFECTS=['Black hole','Googly eyes','Clones','Pixelate','Ice block'];
let effect=0, active=false, t0=0, segmenter, busy=false, box=null, key={x:.5,y:.5}, frame=0;
EFFECTS.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{effect=i;active=false;[...$('fx').children].forEach((x,j)=>x.classList.toggle('on',j==i))};$('fx').append(b)});
$('fx').children[0].classList.add('on');

$('start').onclick=async()=>{
 $('start').hidden=true; $('status').textContent='Loading…';
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:true});
 video.srcObject=new MediaStream(stream.getVideoTracks()); await video.play();
 const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 segmenter=await InteractiveSegmenter.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite",delegate:"GPU"},outputCategoryMask:false,outputConfidenceMasks:true});
 initSnap(stream); $('ui').hidden=false; $('status').textContent='Point at an object, then snap or tap ✨';
 requestAnimationFrame(loop);
};
$('snap').onclick=()=>trigger();
function trigger(){ if(!box) return; active=!active; t0=performance.now(); }

function initSnap(stream){
 const ac=new AudioContext(), an=ac.createAnalyser(); an.fftSize=1024;
 const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2000;
 ac.createMediaStreamSource(stream).connect(hp).connect(an);
 const buf=new Float32Array(an.fftSize); let avg=0.01, last=0;
 (function listen(){ an.getFloatTimeDomainData(buf); let p=0; for(const v of buf) p=Math.max(p,Math.abs(v));
  const now=performance.now(); if(p>0.25&&p>avg*8&&now-last>1200){last=now;trigger();}
  avg=avg*0.95+p*0.05; requestAnimationFrame(listen); })();
}

function segment(){
 if(busy) return; busy=true;
 seg.width=SW; seg.height=Math.round(SW*video.videoHeight/video.videoWidth);
 sctx.drawImage(video,0,0,seg.width,seg.height);
 segmenter.segment(seg,{keypoint:key},r=>{
  const m=r.confidenceMasks[r.confidenceMasks.length-1].getAsFloat32Array();
  const w=seg.width,h=seg.height,img=sctx.createImageData(w,h);
  let x0=w,y0=h,x1=0,y1=0,sx=0,sy=0,n=0;
  for(let i=0;i<m.length;i++){ if(m[i]>.5){const x=i%w,y=(i/w)|0,d=img.data;
   d[i*4]=d[i*4+1]=d[i*4+2]=d[i*4+3]=255; n++; sx+=x; sy+=y;
   if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;}}
  if(n>30){ mk.width=w; mk.height=h; mctx.putImageData(img,0,0);
   const s=c.width/w; box={x:x0*s,y:y0*s,w:(x1-x0)*s,h:(y1-y0)*s,cx:sx/n*s,cy:sy/n*s};
   if(active) key={x:sx/n/w,y:sy/n/h}; }
  else if(!active) box=null;
  busy=false; });
}

function cutout(){
 fx.width=c.width; fx.height=c.height; fctx.drawImage(video,0,0,c.width,c.height);
 fctx.globalCompositeOperation='destination-in'; fctx.drawImage(mk,0,0,c.width,c.height);
 fctx.globalCompositeOperation='source-over'; return fx;
}

function loop(now){
 const W=Math.min(960,video.videoWidth); c.width=W; c.height=Math.round(W*video.videoHeight/video.videoWidth);
 ctx.drawImage(video,0,0,c.width,c.height);
 if(!active) key={x:.5,y:.5};
 if(frame++%2==0) segment();
 if(box){ const t=Math.min(1,(now-t0)/700);
  if(!active){ ctx.save(); ctx.globalAlpha=.3; ctx.drawImage(mk,0,0,c.width,c.height); ctx.restore(); }
  else draw(box,t,now/1000); }
 requestAnimationFrame(loop);
}

function draw(b,t,s){
 const R=Math.max(b.w,b.h)*0.6+10;
 if(effect==0) blackHole(b,R*t,s);
 else if(effect==1) googly(b,s);
 else if(effect==2) clones(b,t,s);
 else if(effect==3) pixelate();
 else ice(b,t);
}

function blackHole(b,R,s){
 for(let k=6;k>=1;k--){ const r=R*(1+k*0.25); ctx.save(); ctx.beginPath(); ctx.arc(b.cx,b.cy,r,0,7); ctx.clip();
  ctx.translate(b.cx,b.cy); ctx.rotate((1.2/k)*(1+.3*Math.sin(s*2))); const z=1+.08/k; ctx.scale(z,z); ctx.translate(-b.cx,-b.cy);
  ctx.drawImage(video,0,0,c.width,c.height); ctx.restore(); }
 const g=ctx.createRadialGradient(b.cx,b.cy,R*.85,b.cx,b.cy,R*1.25);
 g.addColorStop(0,'rgba(255,170,60,.9)'); g.addColorStop(1,'rgba(255,120,0,0)');
 ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.cx,b.cy,R*1.25,0,7); ctx.fill();
 ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(b.cx,b.cy,R,0,7); ctx.fill();
}

function googly(b,s){
 const er=Math.max(8,b.w*.12), ey=b.y+b.h*.35;
 for(const ex of [b.cx-b.w*.18,b.cx+b.w*.18]){
  ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ex,ey,er,0,7); ctx.fill(); ctx.stroke();
  const a=s*3+ex; ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(ex+Math.cos(a)*er*.4,ey+Math.abs(Math.sin(a))*er*.4,er*.5,0,7); ctx.fill(); }
 const mo=Math.abs(Math.sin(s*6))*b.h*.08+2;
 ctx.fillStyle='#600'; ctx.beginPath(); ctx.ellipse(b.cx,b.y+b.h*.62,b.w*.15,mo,0,0,7); ctx.fill();
}

function clones(b,t,s){
 const o=cutout();
 for(let i=0;i<5;i++){ const a=i*1.256+s*.5, d=t*(80+i*25), sc=.5+.1*i;
  ctx.save(); ctx.translate(b.cx+Math.cos(a)*d,b.cy+Math.sin(a)*d*.6); ctx.scale(sc,sc); ctx.translate(-b.cx,-b.cy);
  ctx.drawImage(o,0,0); ctx.restore(); }
}

function pixelate(){
 const o=cutout(), q=12; px.width=c.width/q|0; px.height=c.height/q|0;
 pctx.clearRect(0,0,px.width,px.height); pctx.drawImage(o,0,0,px.width,px.height);
 ctx.imageSmoothingEnabled=false; ctx.drawImage(px,0,0,c.width,c.height); ctx.imageSmoothingEnabled=true;
}

function ice(b,t){
 const pad=Math.max(b.w,b.h)*.15, w=b.w+pad*2, h=(b.h+pad*2)*t, x=b.x-pad, y=b.y+b.h+pad-h;
 ctx.beginPath(); ctx.roundRect(x,y,w,h,14); ctx.fillStyle='rgba(170,220,255,.6)'; ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=3; ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(x+w*.12,y+8,w*.08,h*.7);
}
</script></body></html>
